name: Build Android APK From Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Extract Project Zip
        run: |
          ZIP_FILE=$(find . -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in your repository!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          
          SETTINGS_PATH=$(find ./extracted_project -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: Could not find settings.gradle inside the zip file!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_ROOT"
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x ./gradlew
          
          echo "TARGET_DIR=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Run Build
        run: |
          cd ${{ env.TARGET_DIR }}
          # Added flags to bypass the cache jar creation bug
          ./gradlew assembleDebug --no-configuration-cache --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeem-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
