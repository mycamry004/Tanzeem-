name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto Create Missing Project Configuration
        run: |
          # Create base files if they don't exist anywhere
          if [ -z "$(find . -name "settings.gradle" -o -name "settings.gradle.kts")" ]; then
            echo "Creating missing settings.gradle..."
            echo "rootProject.name = 'Tanzeem'" > settings.gradle
            echo "include ':app'" >> settings.gradle
          fi

          if [ -z "$(find . -name "build.gradle" -o -name "build.gradle.kts" -not -path "*/app/*")" ]; then
            echo "Creating missing root build.gradle..."
            cat << 'EOF' > build.gradle
            buildscript {
                repositories { google(); mavenCentral() }
                dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
            }
            allprojects {
                repositories { google(); mavenCentral() }
            }
          EOF
          fi

          # Generate gradle wrapper files
          gradle wrapper --gradle-version 8.2

          # Make executable
          chmod +x ./gradlew

      - name: Run Build
        run: |
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeem-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
