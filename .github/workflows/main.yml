name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build APK
        run: |
          # Automatically find the directory containing gradlew
          GRADLE_DIR=$(dirname $(find . -name gradlew -print -quit))
          
          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: gradlew file could not be found anywhere in the repository!"
            exit 1
          fi
          
          echo "Found Gradle root at: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          # Make executable and build
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeem-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
