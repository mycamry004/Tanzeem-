name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Environment
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: 'gradlew' was not found anywhere in this repository!"
            echo "Please make sure you uploaded the 'gradlew' file from your zip."
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "TARGET_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Run Build
        run: |
          cd ${{ env.TARGET_DIR }}
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeem-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
