name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find Project and Force Generate Gradle
        run: |
          # Find where the actual app source files are located
          SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: Could not find settings.gradle anywhere in the repository!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          echo "Android project root detected at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # Force generate the missing gradlew and gradle wrapper files
          echo "Generating missing gradle wrapper wrapper..."
          gradle wrapper --gradle-version 8.2
          
          # Make it executable and save path
          chmod +x ./gradlew
          echo "TARGET_DIR=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Run Build
        run: |
          cd ${{ env.TARGET_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeem-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
