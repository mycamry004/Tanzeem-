Name: Build Android APK From Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Find and Extract Project Zip
        run: |
          ZIP_FILE=$(find . -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in your repository!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          
          SETTINGS_PATH=$(find ./extracted_project -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: Could not find settings.gradle inside the zip file!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_ROOT"
          
          # Force generate the required wrapper version
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          
          # Force create the missing debug.keystore file required by debugConfig
          echo "Generating temporary debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          echo "TARGET_DIR=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Inject Gemini API Key Secret
        run: |
          cd ${{ env.TARGET_DIR }}
          # Creates a local secrets configuration or .env file inside your project root
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "api.key=${{ secrets.GEMINI_API_KEY }}" > secrets.properties
          echo "Injected API Key into project configuration files successfully."

      - name: Auto-Increment App Version Numbers
        run: |
          cd ${{ env.TARGET_DIR }}
          
          # Find the app level build.gradle file
          GRADLE_FILE=$(find . -name "build.gradle" -not -path "*/build/*" -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -name "build.gradle.kts" -not -path "*/build/*" -print -quit)
          fi
          
          echo "Found build file to modify: $GRADLE_FILE"
          
          # Calculate version names dynamically using GitHub run number ($GITHUB_RUN_NUMBER)
          # Run 1 -> versionCode 1, versionName 1.01
          # Run 99 -> versionCode 99, versionName 1.99
          # Run 100 -> versionCode 100, versionName 2.00
          VERSION_CODE=$GITHUB_RUN_NUMBER
          
          MAJOR=$(( 1 + (VERSION_CODE / 100) ))
          MINOR=$(( VERSION_CODE % 100 ))
          # Format minor as a two digit number (e.g., 05 instead of 5)
          VERSION_NAME=$(printf "%d.%02d" $MAJOR $MINOR)
          
          echo "Setting automated build parameters..."
          echo "New versionCode: $VERSION_CODE"
          echo "New versionName: $VERSION_NAME"
          
          # Use sed to overwrite existing versionCode and versionName fields inside your code
          sed -i "s/versionCode\s\+[0-9]\+/versionCode $VERSION_CODE/g" "$GRADLE_FILE"
          sed -i 's/versionName\s\+"[^"]*"/versionName "'"$VERSION_NAME"'"/g' "$GRADLE_FILE"
          
          # For Kotlin DSL build.gradle.kts compatibility if needed
          sed -i "s/versionCode\s*=\s*[0-9]\+/versionCode = $VERSION_CODE/g" "$GRADLE_FILE"
          sed -i 's/versionName\s*=\s*"[^"]*"/versionName = "'"$VERSION_NAME"'"/g' "$GRADLE_FILE"

      - name: Run Build
        run: |
          cd ${{ env.TARGET_DIR }}
          # Removed experimental flags that trigger KSP intellij quirks
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeem-Debug-APK
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
