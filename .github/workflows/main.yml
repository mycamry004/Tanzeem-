name: Build Android APK From Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # Required for GitHub Actions to create Releases

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Find and Extract Project Zip
        run: |
          ZIP_FILE=$(find . -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in your repository!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          
          SETTINGS_PATH=$(find ./extracted_project -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: Could not find settings.gradle inside the zip file!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_ROOT"
          
          # Force generate the required wrapper version
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          
          # USE THE KEYSTORE FROM THE ZIP IF IT EXISTS, OTHERWISE GENERATE A TEMPORARY ONE
          if [ -f "debug.keystore" ]; then
            echo "Using permanent debug.keystore included in the ZIP file. Signature will match!"
          else
            echo "Warning: No keystore found in ZIP. Generating temporary debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          echo "TARGET_DIR=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Inject Gemini API Key Secret
        run: |
          cd ${{ env.TARGET_DIR }}
          # Creates a local secrets configuration or .env file inside your project root
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "api.key=${{ secrets.GEMINI_API_KEY }}" > secrets.properties
          echo "Injected API Key into project configuration files successfully."

      - name: Auto-Increment App Version Numbers
        run: |
          cd ${{ env.TARGET_DIR }}
          
          GRADLE_FILE=$(find . -name "build.gradle" -not -path "*/build/*" -print -quit)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -name "build.gradle.kts" -not -path "*/build/*" -print -quit)
          fi
          
          echo "Found build file to modify: $GRADLE_FILE"
          
          VERSION_CODE=$GITHUB_RUN_NUMBER
          MAJOR=$(( 1 + (VERSION_CODE / 100) ))
          MINOR=$(( VERSION_CODE % 100 ))
          VERSION_NAME=$(printf "%d.%02d" $MAJOR $MINOR)
          
          echo "Setting automated build parameters..."
          echo "New versionCode: $VERSION_CODE"
          echo "New versionName: $VERSION_NAME"
          
          sed -i "s/versionCode\s\+[0-9]\+/versionCode $VERSION_CODE/g" "$GRADLE_FILE"
          sed -i 's/versionName\s\+"[^"]*"/versionName "'"$VERSION_NAME"'"/g' "$GRADLE_FILE"
          sed -i "s/versionCode\s*=\s*[0-9]\+/versionCode = $VERSION_CODE/g" "$GRADLE_FILE"
          sed -i 's/versionName\s*=\s*"[^"]*"/versionName = "'"$VERSION_NAME"'"/g' "$GRADLE_FILE"

          # Export tag name for Release step
          echo "RELEASE_TAG=v${VERSION_NAME}" >> $GITHUB_ENV

      - name: Run Build
        run: |
          cd ${{ env.TARGET_DIR }}
          ./gradlew assembleDebug --no-daemon

      - name: Locate Built APK
        run: |
          APK_PATH=$(find extracted_project -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          echo "FOUND_APK=$APK_PATH" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body: "Automated update built for repository mycamry004/Tanzeem-."
          files: ${{ env.FOUND_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
