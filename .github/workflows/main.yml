name: Build Android APK From Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Find and Extract Project Zip
        run: |
          ZIP_FILE=$(find . -name "*.zip" -print -quit)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in your repository!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          
          SETTINGS_PATH=$(find ./extracted_project -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: Could not find settings.gradle inside the zip file!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_ROOT"
          
          # Force generate the required wrapper version
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          
          # Force create the missing debug.keystore file required by debugConfig
          echo "Generating temporary debug keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          echo "TARGET_DIR=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Inject Gemini API Key Secret
        run: |
          cd ${{ env.TARGET_DIR }}
          # Creates a local secrets configuration or .env file inside your project root
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "api.key=${{ secrets.GEMINI_API_KEY }}" > secrets.properties
          echo "Injected API Key into project configuration files successfully."

      - name: Run Build
        run: |
          cd ${{ env.TARGET_DIR }}
          # Removed experimental flags that trigger KSP intellij quirks
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeem-Debug-APK
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
